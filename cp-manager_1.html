// MONTHLY REPORT EXPORT
// ═══════════════════════════════════════════════════════════════
function doExportReport(){
  const selected = Array.from(document.querySelectorAll('.expProj:checked')).map(el=>el.value);
  const month = gv('f_reportMonth') || new Date().toISOString().slice(0,7);
  const preparedBy = gv('f_preparedBy') || 'CP Manager';
  if(!selected.length){ showToast('Select at least one project'); return; }

  const projects = STATE.projects.filter(p=>selected.includes(p.id));
  const wb = XLSX.utils.book_new();

  // ── Cover / Summary sheet ──
  const coverRows = [
    ['CP MANAGER — MONTHLY PROGRESS REPORT'],[''],
    ['Report Period:', month],['Prepared By:', preparedBy],
    ['Generated:', new Date().toLocaleDateString('en-US')],
    ['Projects:', projects.map(p=>p.name).join(', ')],[''],
    ['PROJECT','STATUS','CONTRACT SUM','SPENT','FORECAST','SCHEDULE %','PLANNED %','BUDGET STATUS','SCHEDULE STATUS']
  ];
  projects.forEach(p=>{
    const bd=p.budget_data, sch=p.schedule;
    const contract=bd.original+bd.approved_changes;
    const forecast=bd.spent+bd.committed;
    coverRows.push([
      p.name, p.status, fmtGBP(contract), fmtGBP(bd.spent), fmtGBP(forecast),
      sch.overallProgress+'%', sch.plannedProgress+'%',
      forecast>contract?'⚠ OVER BUDGET':'✓ On Budget',
      sch.overallProgress<sch.plannedProgress-5?'⚠ DELAYED':'✓ On Track'
    ]);
  });
  const covWs=XLSX.utils.aoa_to_sheet(coverRows);
  covWs['!cols']=[{wch:36},{wch:10},{wch:14},{wch:14},{wch:14},{wch:12},{wch:12},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb,covWs,'Summary');

  // ── One sheet per project ──
  projects.forEach(p=>{
    const bd=p.budget_data, sch=p.schedule;
    const contract=bd.original+bd.approved_changes;
    const forecast=bd.spent+bd.committed;
    const isOver=forecast>contract;
    const isDelayed=sch.overallProgress<sch.plannedProgress-5;
    const qPassPct=sch.overallProgress;
    const rows=[
      [`PROJECT REPORT: ${p.name}`],
      ['Client:', p.client, 'Location:', p.location],
      ['Start:', fmtDate(p.startDate), 'End:', fmtDate(p.endDate)],[''],

      ['━━ SCOPE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'],
      ['Scope Statement:', p.scope.description],
      ['Included Items:', p.scope.items.filter(i=>i.included).map(i=>i.title).join(' | ')],
      ['Scope Changes Logged:', p.scope.creepItems.length],
      p.scope.creepItems.length?['Latest Change:', p.scope.creepItems[p.scope.creepItems.length-1]?.description||'']:null,[''],

      ['━━ SCHEDULE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'],
      ['Actual Progress:', sch.overallProgress+'%', 'Planned Progress:', sch.plannedProgress+'%'],
      ['Variance:', (sch.overallProgress-sch.plannedProgress)+'%', 'Status:', isDelayed?'⚠ DELAYED':'✓ On Track'],
      ['Delays Logged:', sch.delayLog.length],
      sch.delayLog.length?['Latest Delay Cause:', sch.delayLog[sch.delayLog.length-1].cause, 'Impact:', sch.delayLog[sch.delayLog.length-1].impact]:null,
      sch.delayLog.length?['Mitigation:', sch.delayLog[sch.delayLog.length-1].solution]:null,[''],

      ['━━ BUDGET ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'],
      ['Original Contract:', fmtGBP(bd.original), 'Approved Changes:', fmtGBP(bd.approved_changes)],
      ['Contract Sum:', fmtGBP(contract), 'Spent to Date:', fmtGBP(bd.spent)],
      ['Committed:', fmtGBP(bd.committed), 'Forecast Final:', fmtGBP(forecast)],
      ['Variance:', fmtGBP(contract-forecast), 'Status:', isOver?'⚠ OVER BUDGET':'✓ Within Budget'],[''],
      ['Dimension Code Breakdown:'],
      ['Code','Area','Budget','Spent','Committed','Variance','Status'],
      ...bd.breakdown.map(l=>[l.code,l.area,fmtGBP(l.budget),fmtGBP(l.spent),fmtGBP(l.committed),fmtGBP(l.budget-l.spent-l.committed),(l.budget-l.spent-l.committed)<0?'OVER':'OK']),[''],

      ['━━ QUALITY ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'],
      ['Requirements:', p.quality.requirements.length, 'Checks:', p.quality.checks.length],
      ['Pass Rate:', p.quality.checks.length?pct(p.quality.checks.filter(c=>c.result==='Pass').length,p.quality.checks.length)+'%':'N/A', 'Open NCRs:', p.quality.ncrs.filter(n=>n.status==='Open').length],
      p.quality.ncrs.length?['NCR Register — Ref','Date','Description','Severity','Status']:null,
      ...p.quality.ncrs.map(n=>[n.ref, fmtDate(n.date), n.description, n.severity, n.status]),[''],

      ['━━ SAFETY ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'],
      ['Requirements:', p.safety.requirements.length, 'Inspections:', p.safety.checks.length],
      ['Pass Rate:', p.safety.checks.length?pct(p.safety.checks.filter(c=>c.result==='Pass').length,p.safety.checks.length)+'%':'N/A', 'Open Incidents:', p.safety.incidents.filter(i=>i.status==='Open').length],
      p.safety.incidents.length?['Incident Register — Ref','Date','Description','Severity','Status']:null,
      ...p.safety.incidents.map(i=>[i.ref, fmtDate(i.date), i.description, i.severity, i.status]),[''],

      ['━━ COMMUNICATIONS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'],
      ['Stakeholders:', p.comms.stakeholders.length, 'Updates Sent:', p.comms.updates.length],
      p.comms.updates.length?['Latest Update:', p.comms.updates[p.comms.updates.length-1].subject]:['Latest Update:','None yet'],
      [''],['━━ END OF REPORT ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'],
    ].filter(Boolean);

    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:28},{wch:40},{wch:20},{wch:20}];
    const tabName=p.name.slice(0,28).replace(/[\\/*?:\[\]]/g,'_');
    XLSX.utils.book_append_sheet(wb,ws,tabName);

    // Log in comms
    p.comms.updates.push({id:uid(),date:today(),type:'Progress Report',
      recipients:['client','contractor'],
      subject:`Monthly Progress Report – ${month}`,
      body:`Auto-generated monthly report for ${month}. Schedule: ${sch.overallProgress}% vs planned ${sch.plannedProgress}%. Budget: ${isOver?'OVER by '+fmtGBP(forecast-contract):'Within budget, headroom '+fmtGBP(contract-forecast)}. Open NCRs: ${p.quality.ncrs.filter(n=>n.status==='Open').length}. Open Incidents: ${p.safety.incidents.filter(i=>i.status==='Open').length}.`,
      sentBy:preparedBy});
  });

  const filename=`CP-Manager-Report-${month}.xlsx`;
  XLSX.writeFile(wb,filename);
  showToast(`Report downloaded: ${filename}`);
  saveState(); render();
}

function attachListeners(){
  document.getElementById('projSelect')?.addEventListener('change', e=>{
    STATE.activeProject=e.target.value; render();
  });

  ['btnNewProj','btnNewProj2'].forEach(id=>{
    document.getElementById(id)?.addEventListener('click',()=>{ modalState='newProject'; showModal(); });
  });

  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click',()=>{ STATE.activeTab=el.dataset.tab; render(); });
  });

  document.querySelectorAll('[data-modal]').forEach(el=>{
    el.addEventListener('click',()=>{ modalState=el.dataset.modal; showModal(); });
  });

  document.querySelectorAll('[data-open-project]').forEach(el=>{
    el.addEventListener('click', e => {
      e.stopPropagation();
      STATE.activeProject = el.dataset.openProject;
      STATE.activeTab = el.dataset.gotoTab || 'scope';
      render();
    });
  });

  document.querySelectorAll('[data-clone-project]').forEach(el=>{
    el.addEventListener('click', e => {
      e.stopPropagation();
      // Pre-select that project as the clone source then open new project modal in clone mode
      STATE.activeProject = el.dataset.cloneProject;
      modalState='newProject';
      showModal();
      // Auto-switch to clone tab after modal opens
      setTimeout(()=>{
        const cloneBtn=document.querySelector('.seg-opt[data-seg="clone"]');
        if(cloneBtn){ cloneBtn.click(); }
        const sel=document.getElementById('f_cloneFrom');
        if(sel) sel.value=el.dataset.cloneProject;
      },80);
    });
  });
}

// ── Send AI message ───────────────────────────────────────────
async function sendAIMessage(textOverride){
  const input = document.getElementById('aiInput');
  const text = textOverride || (input?input.value.trim():'');
  if(!text || AI_THINKING) return;

  aiInputDraft = '';
  AI_MESSAGES.push({ role:'user', text, time: new Date() });
  AI_THINKING = true;
  if(input){ input.value=''; input.style.height='auto'; }
  if(STATE.activeTab!=='ai') STATE.activeTab='ai';
  render();
  scrollAIToBottom();

  try {
    const messages = [];
    // Build conversation history (last 10 exchanges)
    const recent = AI_MESSAGES.slice(-20).filter(m=>m.role!=='ai'||AI_MESSAGES.indexOf(m)>0);
    recent.forEach(m=>{
      if(m.role==='user') messages.push({role:'user',content:m.text});
      else if(m.role==='ai'&&messages.length>0) messages.push({role:'assistant',content:m.text});
    });
    // Ensure alternating and starts with user
    const cleanMsgs = [];
    let lastRole = null;
    for(const m of messages){
      if(m.role!==lastRole){ cleanMsgs.push(m); lastRole=m.role; }
    }
    if(!cleanMsgs.length||cleanMsgs[cleanMsgs.length-1].role!=='user'){
      cleanMsgs.push({role:'user',content:text});
    }

    const resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system: buildAIContext(),
        messages: cleanMsgs
      })
    });
    const data = await resp.json();
    const reply = data.content?.map(c=>c.text||'').join('')||'Sorry, I had trouble responding. Please try again.';
    AI_THINKING = false;
    AI_MESSAGES.push({ role:'ai', text:reply, time: new Date() });
    render();
    scrollAIToBottom();
    if(AI_SPEAK_BACK) speakText(reply);
  } catch(err){
    AI_THINKING = false;
    AI_MESSAGES.push({ role:'ai', text:`I had a connection issue: ${err.message}. Please check your internet and try again.`, time: new Date() });
    render();
    scrollAIToBottom();
  }
}

function scrollAIToBottom(){
  setTimeout(()=>{
    const el=document.getElementById('aiMessages');
    if(el) el.scrollTop=el.scrollHeight;
  },80);
}

// ── Text-to-Speech ────────────────────────────────────────────
let AI_SPEAK_BACK = false;

function toggleSpeakBack(){
  AI_SPEAK_BACK = !AI_SPEAK_BACK;
  if(!AI_SPEAK_BACK && currentUtterance){ synthesis.cancel(); currentUtterance=null; }
  render();
}

function speakText(text){
  if(!synthesis) return;
  synthesis.cancel();
  // Strip markdown for speech
  const clean = text
    .replace(/\*\*(.*?)\*\*/g,'$1')
    .replace(/\*(.*?)\*/g,'$1')
    .replace(/`(.*?)`/g,'$1')
    .replace(/#{1,3}\s/g,'')
    .replace(/\n/g,' ')
    .slice(0,600); // cap for voice
  const utt = new SpeechSynthesisUtterance(clean);
  utt.rate = 1.05;
  utt.pitch = 1;
  utt.volume = 1;
  // Prefer a natural English voice
  const voices = synthesis.getVoices();
  const preferred = voices.find(v=>v.name.includes('Samantha')||v.name.includes('Daniel')||v.name.includes('Google UK')||v.name.includes('en-GB')||v.lang==='en-GB');
  if(preferred) utt.voice = preferred;
  currentUtterance = utt;
  synthesis.speak(utt);
}

// ── Speech Recognition ────────────────────────────────────────
function initRecognition(mode){
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRec){
    showToast('Voice not supported on this browser. Try Chrome or Safari.');
    return null;
  }
  const rec = new SpeechRec();
  rec.continuous = false;
  rec.interimResults = true;
  rec.lang = 'en-US';
  rec.onresult = e=>{
    const transcript = Array.from(e.results).map(r=>r[0].transcript).join('');
    if(mode==='global'){
      updateOrbTranscript(transcript);
    } else {
      const inp=document.getElementById('aiInput');
      if(inp){ inp.value=transcript; aiInputDraft=transcript; onAIInput(inp); }
      updateVoiceBtnTranscript(transcript);
    }
    if(e.results[e.results.length-1].isFinal){
      if(mode==='global') handleGlobalVoiceCommand(transcript);
      else sendAIMessage(transcript);
      stopVoice();
    }
  };
  rec.onerror = e=>{ showToast('Voice error: '+e.error); stopVoice(); };
  rec.onend = ()=>{ if(voiceMode) stopVoice(); };
  return rec;
}

function toggleGlobalVoice(){
  if(voiceMode) { stopVoice(); return; }
  voiceMode='global';
  recognition=initRecognition('global');
  if(!recognition) return;
  recognition.start();
  showVoiceOrb();
  const btn=document.getElementById('btnGlobalMic');
  if(btn) btn.classList.add('listening');
}

function toggleAIVoice(){
  if(voiceMode==='ai-chat') { stopVoice(); return; }
  if(voiceMode) stopVoice();
  voiceMode='ai-chat';
  recognition=initRecognition('ai-chat');
  if(!recognition) return;
  recognition.start();
  const btn=document.getElementById('aiVoiceBtn');
  if(btn){ btn.classList.add('active'); btn.innerHTML='🔴'; }
  showToast('Listening… speak now');
}

function stopVoice(){
  if(recognition){ try{ recognition.stop(); }catch(e){} recognition=null; }
  voiceMode=null;
  hideVoiceOrb();
  const gBtn=document.getElementById('btnGlobalMic');
  if(gBtn) gBtn.classList.remove('listening');
  const aBtn=document.getElementById('aiVoiceBtn');
  if(aBtn){ aBtn.classList.remove('active'); aBtn.innerHTML='🎙'; }
}

// ── Global Voice Orb ──────────────────────────────────────────
function showVoiceOrb(){
  const existing=document.getElementById('voiceOrb');
  if(existing) return;
  const div=document.createElement('div');
  div.className='voice-orb-overlay'; div.id='voiceOrb';
  div.innerHTML=`
    <div class="voice-orb-close" onclick="stopVoice()">✕</div>
    <div style="position:relative">
      <div class="voice-orb-rings"></div>
      <div class="voice-orb-rings"></div>
      <div class="voice-orb-rings"></div>
      <div class="voice-orb listening" onclick="stopVoice()">🎙</div>
    </div>
    <div class="voice-orb-status" id="orbStatus">Listening…</div>
    <div class="voice-orb-transcript" id="orbTranscript">Speak a command</div>
    <div class="voice-orb-hint">Tap orb to cancel</div>`;
  document.body.appendChild(div);
}

function hideVoiceOrb(){

}

function updateOrbTranscript(text){

// ── Global Voice Command Router ───────────────────────────────
// Routes spoken commands to the right action or to the AI
function handleGlobalVoiceCommand(text){
  hideVoiceOrb();
  const lower = text.toLowerCase();

  // Navigation commands
  if(lower.includes('go to') || lower.includes('open') || lower.includes('show me')){
    const tabMap = {'program':'program','scope':'scope','schedule':'schedule','budget':'budget',
      'quality':'quality','safety':'safety','comms':'comms','communication':'comms',
      'copilot':'copilot','ai':'ai','assistant':'ai'};
    for(const [word,tabId] of Object.entries(tabMap)){
      if(lower.includes(word)){ STATE.activeTab=tabId; render(); speakIfEnabled(`Opening ${word}`); return; }
    }
  }

  // Quick status
  if(lower.includes('status')||lower.includes('how are we doing')||lower.includes("what's happening")){
    STATE.activeTab='ai';
    render();
    sendAIMessage('Give me a quick verbal status update on the active project. Keep it under 60 words.');
    return;
  }

  // Copilot check
  if(lower.includes('copilot')||lower.includes('sensor')||lower.includes('alert')){
    STATE.activeTab='copilot'; render();
    const signals=generateSignals(activeProject());
    const msg=signals.length?`Copilot has ${signals.length} signal${signals.length>1?'s':''} firing: ${signals.map(s=>s.label).join(', ')}`:'All Copilot sensors are clear. Project vitals are within range.';
    speakIfEnabled(msg); showToast(msg.slice(0,80)); return;
  }

  // Everything else → send to AI
  STATE.activeTab='ai';
  render();
  sendAIMessage(text);
}

function speakIfEnabled(text){
  if(AI_SPEAK_BACK) speakText(text);
}

// ── Attach quick button listeners ─────────────────────────────
function attachAIListeners(){
  document.querySelectorAll('[data-quick]').forEach(btn=>{
    btn.addEventListener('click',()=>handleQuickBtn(btn.dataset.quick));
  });
}

// ═══════════════════════════════════════════════════════════════
// EVENT DELEGATION
// ═══════════════════════════════════════════════════════════════
function attachListeners(){
  document.getElementById('projSelect')?.addEventListener('change',e=>{STATE.activeProject=e.target.value;render();});
  ['btnNewProj','btnNewProj2'].forEach(id=>{document.getElementById(id)?.addEventListener('click',()=>{modalState='newProject';showModal();});});
  document.querySelectorAll('[data-tab]').forEach(el=>{el.addEventListener('click',()=>{STATE.activeTab=el.dataset.tab;render();});});
  document.querySelectorAll('[data-modal]').forEach(el=>{el.addEventListener('click',()=>{modalState=el.dataset.modal;showModal();});});
  document.querySelectorAll('[data-open-project]').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();STATE.activeProject=el.dataset.openProject;STATE.activeTab=el.dataset.gotoTab||'scope';render();});
  });
  document.querySelectorAll('[data-clone-project]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();STATE.activeProject=el.dataset.cloneProject;modalState='newProject';showModal();
      setTimeout(()=>{const b=document.querySelector('.seg-opt[data-seg="clone"]');if(b)b.click();const s=document.getElementById('f_cloneFrom');if(s)s.value=el.dataset.cloneProject;},80);
    });
  });
  // Delete handlers
  document.querySelectorAll('[data-del-task]').forEach(el=>{el.addEventListener('click',e=>{e.stopPropagation();const p=activeProject();p.schedule.tasks.splice(parseInt(el.dataset.delTask),1);saveState();render();});});
  document.querySelectorAll('[data-del-delay]').forEach(el=>{el.addEventListener('click',e=>{e.stopPropagation();const p=activeProject();p.schedule.delayLog.splice(parseInt(el.dataset.delDelay),1);saveState();render();});});
  document.querySelectorAll('[data-del-budget]').forEach(el=>{el.addEventListener('click',e=>{e.stopPropagation();const p=activeProject();p.budget_data.breakdown.splice(parseInt(el.dataset.delBudget),1);saveState();render();});});
  // AI listeners
  attachAIListeners();
}

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════
render();
</script>
